services:
  master1:
    build: .
    hostname: master1
    container_name: master1
    ports:
      - "9871:9870"
      - "9000:9000"
      - "8088:8088"
    volumes:
      - master1-journalnode:/home/hadoop/hadoopdata/hdfs/journalnode
      - master1-namenode:/home/hadoop/hadoopdata/hdfs/namenode
      - master1-zookeeper:/home/hadoop/zookeeper/data
    environment:
      - MYID=1
      - ROLE=master
    healthcheck:
      test: ["CMD-SHELL", "jps | grep -E 'QuorumPeerMain|NameNode|DFSZKFailoverController|ResourceManager|JournalNode'"]
      interval: 30s
      timeout: 10s
      retries: 5
    # deploy: 
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 1500M
    networks:
      - hadoop-net

  master2:
    build: .
    hostname: master2
    container_name: master2
    ports:
      - "9872:9870"
      - "8089:8088"
    volumes:
      - master2-journalnode:/home/hadoop/hadoopdata/hdfs/journalnode
      - master2-namenode:/home/hadoop/hadoopdata/hdfs/namenode
      - master2-zookeeper:/home/hadoop/zookeeper/data
    environment:
      - MYID=2
      - ROLE=master
    healthcheck:
      test: ["CMD-SHELL", "jps | grep -E 'QuorumPeerMain|NameNode|DFSZKFailoverController|ResourceManager|JournalNode'"]
      interval: 30s
      timeout: 10s
      retries: 5
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 1500M
    networks:
      - hadoop-net

  master3:
    build: .
    hostname: master3
    container_name: master3
    ports:
      - "9873:9870"
      - "8090:8088"
    volumes:
      - master3-journalnode:/home/hadoop/hadoopdata/hdfs/journalnode
      - master3-namenode:/home/hadoop/hadoopdata/hdfs/namenode
      - master3-zookeeper:/home/hadoop/zookeeper/data
    environment:
      - MYID=3
      - ROLE=master
    healthcheck:
      test: ["CMD-SHELL", "jps | grep -E 'QuorumPeerMain|NameNode|DFSZKFailoverController|ResourceManager|JournalNode'"]
      interval: 30s
      timeout: 10s
      retries: 5
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 1500M
    networks:
      - hadoop-net

  worker1:
    build: .
    hostname: worker1
    container_name: worker1
    volumes:
      - worker1-datanode:/home/hadoop/hadoopdata/hdfs/datanode
    environment:
      - ROLE=worker
    healthcheck:
      test: ["CMD-SHELL", "jps | grep -E 'DataNode|NodeManager'"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
      master3:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.5'
    #       memory: 3500M
    networks:
      - hadoop-net

  worker2:
    build: .
    hostname: worker2
    container_name: worker2
    volumes:
      - worker2-datanode:/home/hadoop/hadoopdata/hdfs/datanode
    environment:
      - ROLE=worker
    healthcheck:
      test: ["CMD-SHELL", "jps | grep -E 'DataNode|NodeManager'"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
      master3:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.5'
    #       memory: 3500M
    networks:
      - hadoop-net

  hbmaster1:
    build: .
    hostname: hbmaster1
    container_name: hbmaster1
    ports:
      - "16000:16000"
      - "16010:16010"
    environment:
      - ROLE=hbmaster
    depends_on:
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
      master3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "jps | grep -E 'HMaster'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 1024M
    networks:
      - hadoop-net

  hbmaster2:
    build: .
    hostname: hbmaster2
    container_name: hbmaster2
    ports:
      - "16001:16000"
      - "16011:16010"
    environment:
      - ROLE=hbmaster
    depends_on:
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
      master3:
        condition: service_healthy
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 1024M
    networks:
      - hadoop-net      
